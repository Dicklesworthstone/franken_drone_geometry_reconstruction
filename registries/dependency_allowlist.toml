
schema = "fdgr.dependency_allowlist.v1"
revision = 1
policy = "closed_universe"

[[dependency]]
name = "std"
kind = "rust_platform"
status = "admitted"
reason = "Language and standard-library substrate."

[[dependency]]
name = "asupersync"
kind = "owned_rust"
status = "planned_exact_pin"
reason = "Exclusive async runtime, structured concurrency, capability context, deterministic lab, ATP, and RaptorQ."

[[dependency]]
name = "frankensqlite"
kind = "owned_rust"
status = "planned_exact_pin"
reason = "Canonical transactional ledger after FDGR-specific integration gates."

[[dependency]]
name = "frankenfs"
kind = "owned_rust"
status = "planned_exact_pin"
reason = "Capability-scoped publication, repair planning, crash evidence, and storage custody."

[[dependency]]
name = "frankensearch"
kind = "owned_rust"
status = "planned_exact_pin"
reason = "Derived hybrid retrieval and explainable ranking only."

[[dependency]]
name = "franken_markdown"
kind = "owned_rust"
status = "planned_exact_pin"
reason = "Deterministic human and machine evidence reports."

[[dependency]]
name = "frankengraphdb"
kind = "owned_rust"
status = "design_reuse_then_gate"
reason = "Versioned scene graph, provenance, branches, graph algorithms, and plan certificates."

[[dependency]]
name = "fastmcp-rust"
kind = "owned_rust"
status = "optional_presentation_exact_pin"
reason = "Replaceable MCP presentation plane only; no transport type crosses semantic seams."

[[dependency]]
name = "ffmpeg"
kind = "external_process"
status = "planned_profile_pin"
reason = "Media demux, decode, normalization, and encoding through a supervised sidecar, never FFI."

[[dependency]]
name = "python_model_worker"
kind = "external_process"
status = "research_only"
reason = "Isolated execution of model-specific Python/PyTorch/CUDA stacks behind sealed manifests."

[[forbidden]]
name = "tokio"
reason = "Second runtime and cancellation model."

[[forbidden]]
name = "rayon"
reason = "Ambient parallelism outside structured ownership and budgets."

[[forbidden]]
name = "reqwest"
reason = "Tokio-based network stack in the production Rust trust domain."

[[forbidden]]
name = "hyper"
reason = "External HTTP/runtime surface; use an admitted Asupersync-native transport or process boundary."

[[forbidden]]
name = "axum"
reason = "Web framework unrelated to the semantic core and tied to a second runtime ecosystem."

[[forbidden]]
name = "sqlx"
reason = "External database abstraction and runtime graph."

[[forbidden]]
name = "unsafe"
reason = "FDGR crates use forbid unsafe code without exceptions."
